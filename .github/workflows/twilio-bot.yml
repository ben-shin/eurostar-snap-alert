name: Deploy and test WhatsApp bot

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy or update the instant command webhook
        type: boolean
        default: true
      send_test:
        description: Send one WhatsApp test message to the configured owner
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: eurostar-fare-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install and test
        run: |
          pip install -r requirements-dev.txt
          python -m pytest
          node --test tests/commands.test.js
      - name: Deploy protected webhook and verify it
        if: inputs.deploy
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_WHATSAPP: ${{ secrets.TWILIO_FROM_WHATSAPP }}
          TWILIO_TO_WHATSAPP: ${{ secrets.TWILIO_TO_WHATSAPP }}
        run: python -m eurostar_alerts.deploy_bot
      - name: Save connection metadata
        if: inputs.deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/twilio-control.json
          if ! git diff --cached --quiet; then
            git commit -m "Connect scanner to Twilio phone controls"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Check Twilio and optionally send test message
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_WHATSAPP: ${{ secrets.TWILIO_FROM_WHATSAPP }}
          TWILIO_TO_WHATSAPP: ${{ secrets.TWILIO_TO_WHATSAPP }}
          SEND_TEST: ${{ inputs.send_test }}
        run: |
          args=()
          if [[ "$SEND_TEST" == "true" ]]; then args+=(--send); fi
          python -m eurostar_alerts.test_twilio "${args[@]}"
